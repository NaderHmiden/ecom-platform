# =============================================================================
# cd-prod.yml — Continuous Deployment to Production
#
# Triggers ONLY on git tags matching v*.*.* (semantic versioning).
# Has a manual approval gate — a team member must approve before deploy.
#
# How to release:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Required GitHub Secrets (same as staging + prod-specific):
#   PROD_HOST               → IP or hostname of the production server
#   PROD_USER               → SSH username
#   PROD_SSH_KEY            → Private SSH key
#   PROD_POSTGRES_PASSWORD
#   PROD_JWT_SECRET
# =============================================================================

name: CD — Production

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # Manual approval gate
    # Configure a GitHub Environment named "production" with:
    #   - Required reviewers (your team)
    #   - Protection rules
    # GitHub will pause the workflow here until a reviewer approves.
    # -------------------------------------------------------------------------
    environment:
      name: production
      url: http://${{ secrets.PROD_HOST }}:8080/actuator/health

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add prod host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Extract tag version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Copy docker-compose to prod server
        run: |
          scp docker-compose.yml ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:~/ecom-platform/docker-compose.yml

      - name: Deploy to production (blue/green strategy)
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            cd ~/ecom-platform

            # Pull specific version tag (not 'latest' in production)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set the image tag to the specific version
            export APP_IMAGE_TAG=${{ steps.version.outputs.VERSION }}
            docker compose pull app

            # Graceful restart
            docker compose up -d --no-deps app

            # Health check (2 minutes timeout)
            echo "Waiting for production application to become healthy..."
            for i in $(seq 1 24); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Production deployment successful — version ${{ steps.version.outputs.VERSION }}"
                exit 0
              fi
              echo "Attempt $i/24 — status: $STATUS — waiting 5s..."
              sleep 5
            done
            echo "❌ Production health check failed"
            exit 1
          EOF

      - name: Smoke test production
        run: |
          HEALTH=$(curl -s http://${{ secrets.PROD_HOST }}:8080/actuator/health | jq -r '.status')
          echo "Production health: $HEALTH"
          if [ "$HEALTH" != "UP" ]; then
            echo "❌ Production smoke test FAILED"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🚀 Release ${{ steps.version.outputs.VERSION }}

            Docker image: `ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}`

            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔴 Production deployment failed — initiating rollback"
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            cd ~/ecom-platform
            docker compose up -d --no-deps --pull never app
            echo "Rollback initiated — manual verification required"
          EOF
