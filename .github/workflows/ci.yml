# =============================================================================
# ci.yml — Continuous Integration Pipeline
#
# Triggers on every push and pull request to main / develop.
# Jobs run in parallel where possible; image build only runs on main.
#
# Pipeline stages:
#   1. test        → unit + ArchUnit tests (matrix: JDK 21)
#   2. security    → OWASP dependency CVE scan + Trivy image scan
#   3. build       → Docker image build + push to GHCR (main only)
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 — Test
  # Runs unit tests, ArchUnit module boundary rules, and generates
  # a JaCoCo coverage report uploaded as a build artifact.
  # ---------------------------------------------------------------------------
  test:
    name: Test (JDK 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecom_platform_test
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: mvn test --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecom_platform_test
          SPRING_DATASOURCE_USERNAME: ecom
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_DATA_REDIS_HOST: localhost
          JWT_SECRET: test-secret-key-must-be-at-least-32-bytes-long-for-ci!

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2 — Security Scan
  # Runs in parallel with the test job.
  # OWASP Dependency-Check: scans Maven dependencies for known CVEs.
  # Fails the pipeline if any dependency has CVSS score >= 7 (HIGH severity).
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan (OWASP + Trivy)
    runs-on: ubuntu-latest
    # Run on PRs too — catch vulnerabilities before merge
    needs: []

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "ecom-platform"
          path: "."
          format: "HTML"
          # Fail on HIGH severity (CVSS >= 7)
          args: >
            --failOnCVSS 7
            --enableRetired
        continue-on-error: true  # Don't block PR; report is uploaded below

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3 — Build & Push Docker Image
  # Only runs on pushes to main (not on PRs — we don't push unreviewed images).
  # Builds the multi-stage Dockerfile, tags with git SHA and 'latest',
  # and pushes to GitHub Container Registry (GHCR).
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]   # Only build if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write  # Required to push to GHCR

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers from the registry to speed up subsequent builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          # Fail on HIGH or CRITICAL vulnerabilities only
          severity: "HIGH,CRITICAL"

      - name: Output image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"