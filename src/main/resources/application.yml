spring:
  application:
    name: ecom-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:ecom_platform}
    username: ${POSTGRES_USER:ecom}
    password: ${POSTGRES_PASSWORD:changeme}

  jpa:
    hibernate:
      # Flyway owns the schema, not Hibernate. "validate" makes Hibernate
      # check the entity mappings against what Flyway actually created and
      # fail loudly on mismatch — "update" would let Hibernate silently
      # improvise schema changes Flyway never reviewed. That silent drift
      # is exactly the kind of thing that's fine in a demo and a production
      # incident later.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # No migrations exist yet — added in Phase 3, Step 3.

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-bytes-long-for-hmac-sha256!}
      expiration-seconds: 86400